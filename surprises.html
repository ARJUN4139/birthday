<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>More Birthday Surprises 🎁</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #add8e6, #b3e0ff);
      min-height: 100vh;
      padding: 30px 15px 100px;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      overflow-x: hidden;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      margin-bottom: 25px;
    }

    @media (min-width: 600px) {
      h1 {
        font-size: 2.8rem;
      }
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: pink;
      transform: rotate(45deg);
      animation: float 6s linear infinite;
      border-radius: 50% 50% 0 0;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(1) rotate(45deg); opacity: 1; }
      100% { transform: translateY(-10vh) scale(0.5) rotate(45deg); opacity: 0; }
    }

    .cake-wrapper {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .cake-container {
      position: relative;
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cake-layer {
      width: 160px;
      height: 45px;
      background: #ff69b4;
      border-radius: 100px / 25px;
      margin-bottom: 10px;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
      position: relative;
    }

    .cake-layer.top {
      width: 140px;
      height: 40px;
      background: #ff8ac9;
    }

    .cake-layer.middle {
      width: 160px;
      height: 45px;
    }

    .cake-layer.bottom {
      width: 180px;
      height: 55px;
      background: #ff4da6;
    }

    .icing {
      position: absolute;
      top: -10px;
      left: 0;
      width: 100%;
      height: 25px;
      background: #fff;
      border-radius: 100px / 50px;
      z-index: 1;
      box-shadow: 0 5px 8px rgba(0, 0, 0, 0.1);
    }

    .flame {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 30px;
      background: radial-gradient(circle, yellow 20%, orange 60%, red 100%);
      border-radius: 50%;
      animation: flicker 0.5s infinite alternate;
      cursor: pointer;
      z-index: 3;
    }

    .candle {
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 45px;
      background: #333;
      border-radius: 3px;
      z-index: 2;
    }

    @keyframes flicker {
      from { transform: translateX(-50%) scale(1); opacity: 1; }
      to { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
    }

    #birthdayMessage {
      display: none;
      margin-top: 35px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #fff;
      border-radius: 15px;
      box-shadow: 0 0 20px gold;
      max-width: 340px;
      text-align: center;
      backdrop-filter: blur(8px);
      z-index: 3;
      white-space: pre-wrap;
      overflow: hidden;
      border-right: 2px solid gold;
      color: transparent;
      font-weight: bold;
      font-size: 1.1rem;
      background-image: linear-gradient(90deg, #000000, #b9a7a7, #000000);
      background-clip: text;
      -webkit-background-clip: text;
      background-size: 200% auto;
      animation: shimmer 3s linear infinite, blinkCursor 0.7s steps(1) infinite;
    }

    /* Small box on cake */
    .cake-box {
      position: absolute;
      bottom: -30px;
      right: -20px;
      background: rgba(255, 255, 255, 0.8);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #333;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      z-index: 4;
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="hearts" id="heart-container"></div>
  <canvas id="confetti"></canvas>

  <h1>Let's Celebrate! 🎂</h1>

  <div class="cake-wrapper">
    <div class="cake-container">
      <div class="flame" id="flame" onclick="blowCandle()"></div>
      <div class="candle"></div>
      <div class="cake-layer top"><div class="icing"></div></div>
      <div class="cake-layer middle"><div class="icing"></div></div>
      <div class="cake-layer bottom"><div class="icing"></div></div>
      <div class="cake-box">Betu Flame Var Click Kar</div>
    </div>
  </div>

  <div id="birthdayMessage"></div>

  <script>
    // Floating hearts
    const container = document.getElementById('heart-container');
    for (let i = 0; i < 40; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 3 + 's';
      container.appendChild(heart);
    }

    // Confetti
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let confetti = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function createConfetti() {
      for (let i = 0; i < 200; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 10 + 5,
          color: `hsl(${Math.random() * 360}, 100%, 70%)`,
          tilt: Math.random() * 10 - 10
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach((c, i) => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.fill();
        c.y += c.d * 0.3;
        c.x += Math.sin(c.tilt * Math.PI / 180);
        c.tilt += 0.5;
        if (c.y > canvas.height) {
          confetti[i].y = -10;
          confetti[i].x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(drawConfetti);
    }

    function createConfettiFullScreen() {
      createConfetti();
      drawConfetti();
    }

    // Typing message
    function typeMessage(text, elementId, delay = 40) {
      const el = document.getElementById(elementId);
      let i = 0;
      el.textContent = "";
      function type() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(type, delay);
        }
      }
      type();
    }

    // Candle interaction
    function blowCandle() {
      document.getElementById('flame').style.display = 'none';
      createConfettiFullScreen();
      const msgBox = document.getElementById('birthdayMessage');
      msgBox.style.display = 'block';
      const message = `🎉 Congratulations, my love!\nYou're officially 18 and even more magical than ever.\nHere's to dreams, adventures, and forever together. 💖`;
      typeMessage(message, 'birthdayMessage', 40);
    }
  </script>
</body>
</html>
