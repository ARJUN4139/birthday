<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Baccha 🎂</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #ffb6c1, #ff69b4);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .box {
      position: relative;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid #fff;
      box-shadow: 0 0 40px rgba(255, 105, 180, 0.6);
      border-radius: 25px;
      width: 100%;
      max-width: 500px;
      padding: 40px 25px;
      text-align: center;
      z-index: 2;
      backdrop-filter: blur(12px);
      transition: all 0.6s ease;
    }

    .label {
      position: absolute;
      top: -15px;
      left: -15px;
      background: #ff1493;
      color: white;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 15px 0 15px 0;
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      margin-bottom: 20px;
      color: #fff0f6;
      text-shadow: 2px 2px 12px rgba(255, 105, 180, 0.8);
    }

    .intro {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #fff5fa;
      font-style: italic;
      line-height: 1.8;
    }

    .heart-button {
      display: inline-block;
      margin-top: 30px;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      background-color: #ff1493;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .heart-button:hover {
      background-color: #ff69b4;
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
      transform: scale(1.05);
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #fff;
      opacity: 0.7;
      transform: rotate(45deg);
      animation: float 7s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #fff;
      border-radius: 50%;
    }

    .heart::before {
      top: -9px;
      left: 0;
    }

    .heart::after {
      left: -9px;
      top: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg) scale(0.6);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes fadeOutScale {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.8);
      }
    }

    .box.fade-out {
      animation: fadeOutScale 1.2s forwards;
    }

    /* Small screen optimizations */
    @media (max-width: 480px) {
      .box {
        padding: 30px 20px;
      }
      .heart {
        width: 14px;
        height: 14px;
      }
      .label {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="hearts" id="hearts-container"></div>

  <div class="box" id="main-box">
    <div class="label">🌸 Special Day</div>
    <h1>Happy Birthday Baccha 🎉</h1>
    <div class="intro">
      Today is all about you — the light of my life. <br/>
      I've prepared a little journey filled with surprises just for you. Let's begin…
    </div>
    <a href="#" class="heart-button" onclick="startJourney()">❤️ Begin</a>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 4 + 4) + "s";
      document.getElementById("hearts-container").appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }

    let heartInterval = setInterval(createHeart, 400);

    // Reduce hearts if device width < 480px
    if (window.innerWidth < 480) {
      clearInterval(heartInterval);
      heartInterval = setInterval(createHeart, 800);
    }

    function startJourney() {
      const box = document.getElementById('main-box');
      box.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = "gallery.html"; // Update destination
      }, 1200);
    }
  </script>

</body>
</html>
